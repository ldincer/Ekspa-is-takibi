<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giriş · Ekspa İş Takibi</title>
<style>
:root{--bg:#F2F5F8;--surface:#FFFFFF;--ink:#13202C;--muted:#5A6B7B;--line:#D6DEE6;--accent:#1F5E8C;--accent-ink:#FFFFFF;--bad:#B3261E;--bad-soft:#FADCD9;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E151C;--surface:#16212B;--ink:#E4ECF3;--muted:#93A5B6;--line:#273542;--accent:#6EA7D6;--accent-ink:#0E151C;--bad:#F08C84;--bad-soft:#3D1D1B;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;padding:16px}
.box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font-family:var(--f-display);font-size:24px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=password],input[type=email]{font:inherit;font-size:15px;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-transform:none;letter-spacing:0}
.rem{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
button{font:inherit;font-weight:600;padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="box">
  <h1>Ekspa İş Takibi</h1>
  <p class="sub" id="sub">Devam etmek için giriş yapın.</p>

  <form id="loginForm" autocomplete="on">
    <label>Kullanıcı adı<input type="text" id="u" autocomplete="username" autocapitalize="none" required></label>
    <label>Şifre<input type="password" id="p" autocomplete="current-password" required></label>
    <label class="rem"><input type="checkbox" id="r"> Bu bilgisayarda 30 gün açık kalsın</label>
    <div class="err" id="err" hidden></div>
    <button type="submit" id="btn">Giriş yap</button>
    <div class="hint">Şifrenizi unuttuysanız uygulama yöneticisine başvurun.</div>
  </form>

  <form id="setupForm" hidden>
    <div id="kodWrap" style="display:flex;flex-direction:column;gap:4px" hidden>
      <label>Kurulum kodu<input type="text" id="sk" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="örn. A1B2-C3D4-E5F6"></label>
      <div class="hint">Kod, sunucu açılırken loglara yazılır (Railway: servis → Deployments → View logs).</div>
    </div>
    <label>Kullanıcı adı<input type="text" id="su" autocomplete="username" autocapitalize="none" placeholder="örn. levent" required></label>
    <label>Ad soyad<input type="text" id="sn" autocomplete="name" required></label>
    <label>E-posta<input type="email" id="se" autocomplete="email" placeholder="Bildirimler bu adrese gelir"></label>
    <label>Şifre<input type="password" id="sp" autocomplete="new-password" required></label>
    <label>Şifre (tekrar)<input type="password" id="sp2" autocomplete="new-password" required></label>
    <div class="hint">En az 8 karakter; harf ve rakam içermeli.</div>
    <div class="err" id="serr" hidden></div>
    <button type="submit">Yönetici hesabını oluştur</button>
  </form>
</main>
<script>
const $=s=>document.querySelector(s);
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Sunucuya ulaşılamadı.');return j}
function showErr(el,m){el.textContent=m;el.hidden=false}
const back=()=>{location.href='/'+(location.hash||'')};
fetch('/api/kurulum').then(r=>r.json()).then(j=>{if(j.kurulumGerekli){$('#loginForm').hidden=true;$('#setupForm').hidden=false;
  $('#sub').textContent='İlk kurulum: uygulamanın yönetici hesabını oluşturun. Diğer kullanıcıları bu hesapla ekleyeceksiniz.';
  if(j.kodGerekli){$('#kodWrap').hidden=false;$('#sk').required=true;$('#sk').focus()}else $('#su').focus()}else $('#u').focus()}).catch(()=>{});
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#err').hidden=true;$('#btn').disabled=true;
  try{await post('/api/login',{username:$('#u').value,password:$('#p').value,remember:$('#r').checked});back()}
  catch(x){showErr($('#err'),x.message);$('#p').select()}finally{$('#btn').disabled=false}});
$('#setupForm').addEventListener('submit',async e=>{e.preventDefault();$('#serr').hidden=true;
  if($('#sp').value!==$('#sp2').value)return showErr($('#serr'),'Şifreler aynı değil.');
  try{await post('/api/kurulum',{kod:$('#sk').value,username:$('#su').value,name:$('#sn').value,email:$('#se').value,password:$('#sp').value});back()}catch(x){showErr($('#serr'),x.message)}});
</script>
</body>
</html>
