<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Satış · Ekspa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: sticky toolbar, then one of three views (pipeline board, list, summary); detail drawer slides from the right. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --sunk:#E8EDF2; --ink:#13202C; --muted:#5A6B7B; --line:#D6DEE6;
  --accent:#1F5E8C; --accent-ink:#FFFFFF; --accent-soft:#DCEAF5;
  --ekspa:#1F5E8C; --ekspres:#0E7468;
  --ok:#1C7A4B; --ok-soft:#DDF1E6; --warn:#9A6212; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#FADCD9;
  --shadow:0 1px 2px rgba(19,32,44,.06),0 2px 8px rgba(19,32,44,.06);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#16212B; --sunk:#111A22; --ink:#E4ECF3; --muted:#93A5B6; --line:#273542;
  --accent:#6EA7D6; --accent-ink:#0E151C; --accent-soft:#1B3347;
  --ekspa:#6EA7D6; --ekspres:#4FC1AE;
  --ok:#5BC48C; --ok-soft:#163327; --warn:#E3A953; --warn-soft:#3A2B14; --bad:#F08C84; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16212B; --sunk:#111A22; --ink:#E4ECF3; --muted:#93A5B6; --line:#273542;
  --accent:#6EA7D6; --accent-ink:#0E151C; --accent-soft:#1B3347;
  --ekspa:#6EA7D6; --ekspres:#4FC1AE;
  --ok:#5BC48C; --ok-soft:#163327; --warn:#E3A953; --warn-soft:#3A2B14; --bad:#F08C84; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:8px;padding:3px;margin-left:auto}
.tabs a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:0 12px}
.bar2 input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.bar2 select{padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--bad)}
.usr{position:relative}
.usr>.btn{display:flex;align-items:center;gap:8px;padding:5px 10px}
.usr .av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(19,32,44,.16);padding:6px;z-index:15;display:flex;flex-direction:column}
.menu .mh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12px;color:var(--muted)}
.menu .mh b{display:block;color:var(--ink);font-size:14px}
.menu button,.menu a{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13px}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:var(--accent-soft)}
.rolechip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.rolechip.yonetici{background:var(--accent-soft);color:var(--accent)}
.off td{color:var(--muted)}
.uform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px;align-items:end}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inline input,.inline select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px;min-width:0}
.btn.sm{padding:4px 9px;font-size:12px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:22;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(400px,100%);padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--f-display);margin:0;font-size:20px}
.errbox{background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;font-size:13px}

main{padding-block:16px 40px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted);max-width:560px;margin:40px auto}

/* Board */
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;min-height:60vh}
.col{background:var(--sunk);border-radius:10px;display:flex;flex-direction:column;min-width:0;border:1px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col.closed{opacity:.92}
.colhead{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.colhead .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.colhead h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.05em}
.colhead .cnt{color:var(--muted);font-size:12px}
.colhead .sums{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto;max-height:70vh}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px 9px 12px;cursor:pointer;position:relative;box-shadow:var(--shadow);text-align:left;width:100%}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--co)}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.4}
.card .nm{font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.card .cu{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:12px}
.amt{font-family:var(--f-mono);font-weight:500}
.amt.zero{color:var(--muted);font-weight:400}
.pm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:600;margin-left:auto;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.plan{background:var(--sunk);color:var(--muted)}
.chip.co{border:1px solid var(--co);color:var(--co)}
.more{font-size:12px;color:var(--muted);text-align:center;padding:4px}

/* List */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0;white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--accent)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
td .nm{font-weight:600;max-width:360px}
.stg{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--sunk);white-space:nowrap}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .v.sm{font-size:19px;line-height:1.25}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:70px;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.done i{background:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
td .sub{font-size:12px;color:var(--muted)}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{position:static;background:none;padding:4px 6px;font-size:10px}
.lines td{padding:4px 6px;border-bottom:1px solid var(--line)}
.lines input{width:100%;min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px}
.lines td.x{width:30px;text-align:center}
.lines .rm{all:unset;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:4px}
.lines .rm:hover{color:var(--bad);background:var(--bad-soft)}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.sumrow b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.drawer.wide{width:min(760px,100%)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel h3{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel .note{font-size:12px;color:var(--muted);padding:8px 14px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);min-width:80px}
.stack i{display:block;height:100%}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.alist li:hover{background:var(--accent-soft)}
.alist .x{flex:1;min-width:0}
.alist .x div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--f-display);font-size:19px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.db{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.stages button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.stages button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .w{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);width:100%;min-width:0}
textarea{resize:vertical}
.sec{font-family:var(--f-display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 0;color:var(--muted)}
.margin{font-size:12px;color:var(--muted)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes .by{font-size:11px;color:var(--muted);margin-bottom:2px;white-space:normal}
.df{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .status{margin-right:auto}
.modsw{display:flex;gap:2px;background:var(--sunk);border-radius:8px;padding:3px}
.modsw a{padding:5px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.02em}
.modsw a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.tabs{margin-left:0}.brand small{display:none}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<header class="top">
  <div class="bar1 gut">
    <div class="brand"><h1>Fırsat ve Proje</h1><small id="countLine">Yükleniyor…</small></div>
    <nav class="modsw" aria-label="Bölüm"><a href="/satis" data-mod="crm">Satış</a><a href="/servis" data-mod="servis">Teknik Servis</a></nav>
    <nav class="tabs" aria-label="Görünüm">
      <a href="#pano" data-v="pano">Pano</a><a href="#liste" data-v="liste">Liste</a><a href="#ozet" data-v="ozet">Özet</a><a href="#projeler" data-v="projeler">Projeler</a>
    </nav>
    <div class="usr">
      <button class="btn" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="av" id="meAv">?</span><span id="meName">…</span> ▾</button>
      <div class="menu" id="userMenu" hidden>
        <div class="mh"><b id="meFull"></b><span id="meRole"></span></div>
        <button type="button" data-act="pw">Şifremi değiştir</button>
        <a href="/servis#ayarlar" id="setLink" hidden>Ayarlar (e-posta)</a>
        <a href="/servis#kullanicilar" id="usersLink" hidden>Kullanıcıları yönet</a>
        <button type="button" data-act="logout">Çıkış yap</button>
      </div>
    </div>
  </div>
  <div class="bar2 gut">
    <input id="q" type="search" placeholder="Fırsat, müşteri, kişi, iş ortağı ara…" aria-label="Ara">
    <select id="fCo" aria-label="Firma"><option value="">Tüm firmalar</option><option>EKS-PA</option><option>EKSPRES-BİM</option></select>
    <select id="fPm" aria-label="Proje yöneticisi"><option value="">Tüm yöneticiler</option></select>
    <select id="fCur" aria-label="Para birimi"><option value="">Tüm para birimleri</option><option>USD</option><option>TRY</option><option>EUR</option></select>
    <button class="btn primary" id="addBtn" type="button">+ Yeni fırsat</button>
    <button class="btn" id="xlsxBtn" type="button" hidden>Excel indir</button>
    <button class="btn" id="csvBtn" type="button" hidden title="Odoo'ya geri aktarmak için">CSV indir</button>
    <span class="status" id="status"></span>
  </div>
</header>

<main class="gut" id="main"><div class="empty">Fırsatlar yükleniyor…</div></main>
<div id="drawerHost"></div>
<div id="modalHost"></div>

<script src="xlsx.full.min.js"></script>
<script>
const STAGES=[
  {k:'ilgi',t:'İlgilenilen',open:true},{k:'teklif',t:'Teklif Verildi',open:true},
  {k:'kazanildi',t:'Kazanıldı',open:true},{k:'tamamlandi',t:'Tamamlandı'},
  {k:'iptal',t:'İptal'},{k:'kayip',t:'Kayıp'}];
const STAGE_T=Object.fromEntries(STAGES.map(s=>[s.k,s.t]));
const ODOO_STAGE={ilgi:'İlgilenilen Fırsatlar',teklif:'Teklif Verilen Fırsatlar',kazanildi:'Kazanılan Projeler',tamamlandi:'Tamamlanan Projeler',iptal:'İptal Edilen Fırsatlar',kayip:'Kayıp'};
const SYM={USD:'$',TRY:'₺',EUR:'€'};
const nf=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const S={openP:null,deals:new Map(),view:'pano',q:'',co:'',pm:'',cur:'',sort:{k:'order',d:1},open:null,canWrite:true,loaded:false,rev:-1,me:null,users:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c)=>v?`${SYM[c]||''}${nf.format(v)}${SYM[c]?'':' '+(c||'')}`:'—';
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toLocaleUpperCase('tr');
const today=()=>new Date().toISOString().slice(0,10);
const coVar=c=>c==='EKSPRES-BİM'?'var(--ekspres)':'var(--ekspa)';
function due(d){if(!d)return null;const t=today();if(d<t)return'late';const diff=(new Date(d)-new Date(t))/864e5;return diff<=7?'soon':'plan'}
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}.${m}.${y}`}
let toastT;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.append(el)}el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}
function setStatus(m,err){const s=$('#status');s.textContent=m||'';s.classList.toggle('err',!!err)}

function filtered(){
  const q=S.q.trim().toLocaleLowerCase('tr');
  return[...S.deals.values()].filter(d=>(!S.co||d.company===S.co)&&(!S.pm||d.pm===S.pm)&&(!S.cur||d.currency===S.cur)&&
    (!q||[d.name,d.customer,d.contact,d.partner,d.pm].join(' ').toLocaleLowerCase('tr').includes(q)));
}
function sumsByCur(list){const o={};for(const d of list){if(d.amount){o[d.currency||'?']=(o[d.currency||'?']||0)+d.amount}}return o}
function sumsHtml(o){const k=Object.keys(o);return k.length?k.sort().map(c=>`<span class="num">${money(o[c],c)}</span>`).join(''):'<span>Tutar girilmemiş</span>'}

/* ---------- Board ---------- */
function renderBoard(list){
  const by=Object.fromEntries(STAGES.map(s=>[s.k,[]]));
  list.forEach(d=>(by[d.stage]||by.ilgi).push(d));
  for(const k in by)by[k].sort((a,b)=>(a.nextDate||'9999').localeCompare(b.nextDate||'9999')||(b.amount-a.amount)||(a.order-b.order));
  return`<div class="board-wrap"><div class="board">${STAGES.map(s=>{
    const arr=by[s.k];

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll('.tabs a').forEach(a=>a.dataset.v===S.view?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  const all=[...S.deals.values()];
  $('#countLine').textContent=S.loaded?`${all.length} fırsat · ${all.filter(d=>d.stage==='ilgi'||d.stage==='teklif').length} açık`:'Yükleniyor…';
  const pmSel=$('#fPm'),pms=[...new Set(all.map(d=>d.pm).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const want=['',...pms].join('|');if(pmSel.dataset.k!==want){pmSel.dataset.k=want;pmSel.innerHTML='<option value="">Tüm yöneticiler</option>'+pms.map(p=>`<option>${esc(p)}</option>`).join('');pmSel.value=S.pm}
  const main=$('#main');
  document.querySelector('.bar2').hidden=S.view==='kullanicilar';
  if(S.view==='kullanicilar'){main.innerHTML=renderUsers();return}
  if(!S.loaded){return}
  if(!all.length){main.innerHTML=`<div class="empty"><b>Henüz fırsat yok.</b><br>“+ Yeni fırsat” ile ilk kaydı ekleyin; eklenen her fırsat bu sunucuya bağlanan herkesle paylaşılır.</div>`;return}
  const list=filtered();
  const sx=main.querySelector('.board-wrap')?.scrollLeft||0;
  main.innerHTML=S.view==='projeler'?renderProjects(list):!list.length?`<div class="empty">Filtrelerle eşleşen fırsat yok.</div>`:S.view==='liste'?renderList(list):S.view==='ozet'?renderSummary(list):renderBoard(list);
  const bw=main.querySelector('.board-wrap');if(bw)bw.scrollLeft=sx;

  if(S.openP)refreshProjectHead();
}

}

function num(v){const s=String(v||'').trim().replace(/\s/g,'');if(!s)return 0;const n=Number(/,\d{1,2}$/.test(s)?s.replace(/\./g,'').replace(',','.'):s.replace(/[.,](?=\d{3}(\D|$))/g,''));return isFinite(n)?n:0}

    currency:g('currency'),company:g('company'),pm:g('pm').trim(),nextStep:g('nextStep').trim(),nextDate:g('nextDate'),stage:draft.stage};

/* ---------- Writes (yerel sunucu API) ---------- */
async function api(method,url,body){
  const r=await fetch(url,{method,cache:'no-store',headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location.href='/giris';throw{code:401,message:'Oturum kapandı'}}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status,message:j.error||'Sunucu hatası'};return j;
}
function onWriteErr(e){setStatus(e?.message?`Kaydedilemedi: ${e.message}`:'Sunucuya ulaşılamadı; ağ bağlantısını kontrol edin.',true)}
function applyLocal(d){S.deals.set(d.id,d);render()}
async function save(){
  const f=readForm();if(!f.name){$('#dStatus').textContent='Fırsat adı gerekli.';$('#f_name').focus();return}
  try{
    if(S.open==='__new'){const d=await api('POST','/api/deals',f);closeDrawer();applyLocal(d);toast('Fırsat eklendi')}
    else{const d=await api('PUT','/api/deals/'+encodeURIComponent(S.open),f);closeDrawer();applyLocal(d);toast('Kaydedildi')}
    setStatus('');
  }catch(e){onWriteErr(e)}
}
async function setStage(id,stage){
  const d=S.deals.get(id);if(!d||d.stage===stage)return;
  applyLocal({...d,stage});
  try{applyLocal(await api('PUT','/api/deals/'+encodeURIComponent(id),{stage}));toast(`${d.name.slice(0,40)} → ${STAGE_T[stage]}`)}catch(e){applyLocal(d);onWriteErr(e)}
}
async function addNote(){
  const t=$('#noteIn')?.value.trim();if(!t)return;const id=S.open;
  const btn=$('#noteBtn');btn.disabled=true;
  try{const d=await api('POST','/api/deals/'+encodeURIComponent(id)+'/notes',{text:t});$('#noteIn').value='';S.deals.set(id,d);render()}catch(e){onWriteErr(e)}finally{btn.disabled=false}
}
async function del(){
  const b=$('#delBtn');if(!delArmed){delArmed=true;b.classList.add('armed');b.textContent='Silmeyi onayla';setTimeout(()=>{if(b.isConnected){delArmed=false;b.classList.remove('armed');b.textContent='Sil'}},4000);return}
  const id=S.open;try{await api('DELETE','/api/deals/'+encodeURIComponent(id));closeDrawer();S.deals.delete(id);render();toast('Fırsat silindi')}catch(e){onWriteErr(e)}
}

/* ---------- CSV (Odoo içe aktarma sütunları) ---------- */

  filtered().sort((a,b)=>a.order-b.order).forEach(d=>rows.push([d.name,d.customer,d.contact,d.partner,String(d.amount).replace('.',','),String(d.cost).replace('.',','),d.currency==='EUR'?'EURO':d.currency,d.pm,d.company,ODOO_STAGE[d.stage],d.nextStep,d.nextDate]));

  saveFile(`ekspa-firsatlar-${today()}.csv`,new Blob([csv],{type:'text/csv;charset=utf-8'}));
}

const PROJECT_STAGES=['kazanildi','tamamlandi'];
let pdraft=null;
const isProject=d=>PROJECT_STAGES.includes(d.stage);
const uid8=()=>Math.random().toString(36).slice(2,10);
function proj(d){const p=d.project||{};return{contractStart:p.contractStart||'',contractEnd:p.contractEnd||'',
  contractAmount:p.contractAmount??(d.amount||0),costAmount:p.costAmount??(d.cost||0),currency:p.currency||d.currency||'',
  note:p.note||'',invoices:p.invoices||[],supplierPayments:p.supplierPayments||[],_saved:!!d.project}}
function pcalc(p){
  const t=today(),sum=a=>a.reduce((x,r)=>x+(+r.amount||0),0);
  const invoiced=sum(p.invoices),collected=sum(p.invoices.filter(r=>r.collectedDate&&r.collectedDate<=t));
  const paid=sum(p.supplierPayments.filter(r=>r.date&&r.date<=t)),plannedPay=sum(p.supplierPayments.filter(r=>!r.date||r.date>t));
  const overdue=p.invoices.filter(r=>r.date&&!r.collectedDate&&(new Date(t)-new Date(r.date))/864e5>30);
  let status='Tarih girilmemiş',sk='plan',pct=null;
  if(p.contractStart&&p.contractEnd){const a=new Date(p.contractStart),b=new Date(p.contractEnd),n=new Date(t);
    pct=Math.max(0,Math.min(1,(n-a)/((b-a)||1)));
    if(t<p.contractStart){status='Başlamadı';sk='plan'}else if(t>p.contractEnd){status='Süresi doldu';sk='done'}
    else{const left=(b-n)/864e5;status=left<=60?`Bitime ${Math.ceil(left)} gün`:'Devam ediyor';sk=left<=60?'soon':'ok'}}
  return{invoiced,collected,receivable:invoiced-collected,unbilled:Math.max(0,p.contractAmount-invoiced),paid,plannedPay,
    profit:p.contractAmount-p.costAmount,margin:p.contractAmount?(p.contractAmount-p.costAmount)/p.contractAmount:null,overdue,status,sk,pct};
}
function renderProjects(list){
  const ps=list.filter(isProject).map(d=>({d,p:proj(d)})).map(x=>({...x,c:pcalc(x.p)}));

  if(!allP.length)return`<div class="empty"><b>Henüz proje yok.</b><br>Bir fırsatı Pano'da “Kazanıldı” sütununa taşıdığınızda burada proje olarak görünür.</div>`;
  if(!ps.length)return`<div class="empty">Filtrelerle eşleşen proje yok.</div>`;
  const byCur=f=>{const o={};ps.forEach(x=>{const c=x.p.currency||'?';o[c]=(o[c]||0)+f(x)});return Object.entries(o).filter(([,v])=>v).sort().map(([c,v])=>money(v,c)).join(' · ')||'—'};
  const t=today(),in30=new Date(Date.now()+30*864e5).toISOString().slice(0,10),in60=new Date(Date.now()+60*864e5).toISOString().slice(0,10);
  const ev=[];
  ps.forEach(({d,p,c})=>{
    c.overdue.forEach(r=>ev.push({k:r.date,cls:'late',t:`Tahsil edilmedi · fatura ${fmtDate(r.date)}`,a:money(r.amount,p.currency),d}));
    p.invoices.filter(r=>r.collectedDate>t&&r.collectedDate<=in30).forEach(r=>ev.push({k:r.collectedDate,cls:'soon',t:`Beklenen tahsilat`,a:money(r.amount,p.currency),d}));
    p.supplierPayments.filter(r=>r.date>=t&&r.date<=in30).forEach(r=>ev.push({k:r.date,cls:'soon',t:`Tedarikçi ödemesi${r.supplier?' · '+esc(r.supplier):''}`,a:money(r.amount,p.currency),d}));
    if(p.contractEnd>=t&&p.contractEnd<=in60)ev.push({k:p.contractEnd,cls:'plan',t:'Sözleşme bitiyor',a:'',d});
  });
  ev.sort((a,b)=>a.k.localeCompare(b.k));
  const active=ps.filter(x=>x.c.sk==='ok'||x.c.sk==='soon').length, missing=ps.filter(x=>!x.p._saved).length;
  const rows=ps.sort((a,b)=>(a.p.contractEnd||'9999').localeCompare(b.p.contractEnd||'9999')).map(({d,p,c})=>`<tr data-pid="${d.id}" tabindex="0">
    <td><div class="nm">${esc(d.name)}</div><div class="sub">${esc(d.customer)} · ${esc(d.pm)}</div></td>
    <td><span class="stg">${STAGE_T[d.stage]}</span>${p._saved?'':'<div class="sub">Bilgi girilmedi</div>'}</td>
    <td>${p.contractStart?fmtDate(p.contractStart):'—'} – ${p.contractEnd?fmtDate(p.contractEnd):'—'}${c.pct!=null?`<div class="prog ${c.sk==='done'?'done':''}"><i style="width:${c.pct*100}%"></i></div>`:''}<div class="sub"><span class="chip ${c.sk}">${c.status}</span></div></td>
    <td class="r num">${money(p.contractAmount,p.currency)}</td>
    <td class="r num">${money(p.costAmount,p.currency)}</td>
    <td class="r num">${money(c.profit,p.currency)}<div class="sub">${c.margin!=null?'%'+nf.format(c.margin*100):''}</div></td>
    <td class="r num">${money(c.invoiced,p.currency)}<div class="sub">${p.contractAmount?'%'+nf.format(c.invoiced/p.contractAmount*100)+' faturalandı':''}</div></td>
    <td class="r num">${money(c.receivable,p.currency)}${c.overdue.length?`<div><span class="chip late">${c.overdue.length} gecikmiş</span></div>`:''}</td>
    <td class="r num">${money(c.paid,p.currency)}${c.plannedPay?`<div class="sub">${money(c.plannedPay,p.currency)} planlı</div>`:''}</td></tr>`).join('');
  return`<div class="kpis">
    <div class="kpi"><div class="l">Proje</div><div class="v num">${ps.length}</div><div class="s">${active} tanesi sözleşme döneminde · ${missing} tanesinde bilgi eksik</div></div>
    <div class="kpi"><div class="l">Sözleşme toplamı</div><div class="v sm num">${byCur(x=>x.p.contractAmount)}</div><div class="s">Brüt kâr: ${byCur(x=>x.c.profit)}</div></div>
    <div class="kpi"><div class="l">Açık alacak</div><div class="v sm num" style="color:${ps.some(x=>x.c.overdue.length)?'var(--bad)':'inherit'}">${byCur(x=>x.c.receivable)}</div><div class="s">Faturalanıp tahsil edilmemiş</div></div>
    <div class="kpi"><div class="l">Faturalanmamış</div><div class="v sm num">${byCur(x=>x.c.unbilled)}</div><div class="s">Sözleşme tutarı − kesilen faturalar</div></div>
  </div>
  <div class="grid2" style="grid-template-columns:1fr">
   <div class="panel"><h3>Projeler</h3><div class="tbl-wrap" style="border:0;border-radius:0"><table><thead><tr>
     <th>Proje</th><th>Aşama</th><th>Sözleşme dönemi</th><th class="r">Sözleşme</th><th class="r">Maliyet</th><th class="r">Brüt kâr</th><th class="r">Faturalanan</th><th class="r">Açık alacak</th><th class="r">Tedarikçiye ödenen</th></tr></thead>
     <tbody>${rows}</tbody></table></div>
     <div class="note">Tutarlar her projenin kendi para biriminde. Tahsilat veya ödeme tarihi bugünden sonraysa “planlı” sayılır. Fatura tarihinden 30 günden fazla geçip tahsilat tarihi girilmemişse “gecikmiş” işaretlenir.</div></div>
   <div class="panel"><h3>Önümüzdeki 30 gün ve gecikenler</h3>${ev.length?`<ul class="alist">${ev.slice(0,20).map(e=>`<li data-pid="${e.d.id}" tabindex="0"><span class="chip ${e.cls}">${fmtDate(e.k)}</span><div class="x"><div><b>${esc(e.d.name)}</b></div><div class="status">${e.t}</div></div><span class="amt">${e.a}</span></li>`).join('')}</ul>`
     :`<div class="note">Yaklaşan tahsilat, tedarikçi ödemesi veya biten sözleşme yok.</div>`}</div>
  </div>`;
}

async function logout(){try{await api('POST','/api/logout')}catch{}location.href='/giris'}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#userBtn')){toggleMenu($('#userMenu').hidden);return}
  if(!t.closest('#userMenu'))toggleMenu(false);
  const ma=t.closest('[data-act]');if(ma){toggleMenu(false);if(ma.dataset.act==='pw')pwModal(false);if(ma.dataset.act==='logout')logout();return}
  if(t.closest('#usersLink'))toggleMenu(false);
  if(t.closest('[data-mclose]')){$('#modalHost').innerHTML='';return}
  if(t.closest('[data-uact]')&&!t.matches('select')){userAction(e);return}
  if(t.closest('[data-close]'))return closeDrawer();
  const sb=t.closest('[data-sort]');if(sb){const k=sb.dataset.sort;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==='amount'||k==='cost'?-1:1};return render()}
  const sp=t.closest('.stages button');if(sp&&draft){draft.stage=sp.dataset.k;document.querySelectorAll('.stages button').forEach(b=>b.setAttribute('aria-pressed',b===sp));return}
  if(t.closest('#saveBtn'))return save();
  if(t.closest('#delBtn'))return del();
  if(t.closest('#noteBtn'))return addNote();
  const sf=t.closest('[data-stage-filter]');if(sf){location.hash='#liste';return}
  const op=t.closest('[data-openp]');if(op)return openProject(op.dataset.openp);
  const od=t.closest('[data-opendeal]');if(od){S.openP=null;return openDeal(od.dataset.opendeal)}
  if(t.closest('#pSave'))return saveProject();
  const ad=t.closest('[data-add]');if(ad){pdraft={...proj(S.deals.get(S.openP)),...readProjectForm(),_saved:proj(S.deals.get(S.openP))._saved};const k=ad.dataset.add;
    pdraft[k]=[...pdraft[k],k==='invoices'?{id:uid8(),no:'',date:today(),amount:0,collectedDate:''}:{id:uid8(),supplier:'',date:'',amount:0}];renderProjectDrawer();
    const rows=document.querySelectorAll(`#${k==='invoices'?'invLines':'payLines'} tr[data-line]`);rows[rows.length-1]?.querySelector('input')?.focus();return}
  const rm=t.closest('[data-rm]');if(rm){rm.closest('tr').remove();projectSummary();return}
  const pr=t.closest('[data-pid]');if(pr&&!t.closest('.drawer'))return openProject(pr.dataset.pid);
  const item=t.closest('[data-id]');if(item&&!t.closest('.drawer'))return openDeal(item.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.open)closeDrawer();toggleMenu(false);if($('[data-mclose]'))$('#modalHost').innerHTML=''}
  if(e.key==='Enter'&&e.target.matches('tr[data-id],li[data-id]'))openDeal(e.target.dataset.id);
  if(e.key==='Enter'&&e.target.matches('tr[data-pid],li[data-pid]'))openProject(e.target.dataset.pid);
});
document.addEventListener('input',e=>{if(e.target.matches('#f_amount,#f_cost,#f_currency'))updateMargin()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('#fCo').addEventListener('change',e=>{S.co=e.target.value;render()});
$('#fPm').addEventListener('change',e=>{S.pm=e.target.value;render()});
$('#fCur').addEventListener('change',e=>{S.cur=e.target.value;render()});
$('#addBtn').addEventListener('click',()=>{S.open='__new';draft=null;renderDrawer()});
$('#csvBtn').addEventListener('click',exportCsv);
$('#xlsxBtn').addEventListener('click',exportXlsx);
// drag & drop between columns
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(!c||S.canWrite===false)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',e=>{e.target.closest?.('.card')?.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('.col');if(!col||!dragId)return;e.preventDefault();col.classList.remove('over');setStage(dragId,col.dataset.stage)});
// views on the hash
function route(){const h=location.hash.slice(1);S.view=['pano','liste','ozet','projeler'].includes(h)?h:'pano';if(S.view==='kullanicilar')loadUsers();render()}
window.addEventListener('hashchange',route);

/* ---------- Boot ---------- */
(async function boot(){
  try{const v=localStorage.getItem('ekspa-filters');if(v){const f=JSON.parse(v);Object.assign(S,{co:f.co||'',cur:f.cur||''});$('#fCo').value=S.co;$('#fCur').value=S.cur}}catch{}
  ['fCo','fCur'].forEach(id=>$('#'+id).addEventListener('change',()=>{try{localStorage.setItem('ekspa-filters',JSON.stringify({co:S.co,cur:S.cur}))}catch{}}));
  try{S.me=await api('GET','/api/me')}catch{return}
  $('#meName').textContent=S.me.name;$('#meFull').textContent=S.me.name;$('#meRole').textContent=S.me.roleName+' · '+S.me.username;$('#meAv').textContent=initials(S.me.name);
  S.canWrite=S.me.crmLevel>=2;
  modSwitch('crm');
  if(!S.canWrite){$('#addBtn').hidden=true}
  if(S.me.admin){$('#usersLink').hidden=false;$('#setLink').hidden=false}
  $('#csvBtn').hidden=false;$('#xlsxBtn').hidden=false;
  route();
  if(!S.me.mustChange&&!S.me.crmLevel){location.href=S.me.servisLevel?'/servis':'/';return}
  if(S.me.mustChange){pwModal(true);$('#main').innerHTML='<div class="empty">Devam etmek için yeni şifrenizi belirleyin.</div>';return}
  startData();
})();
async function load(){
    try{const j=await api('GET','/api/deals');
      S.deals=new Map(j.deals.map(d=>[d.id,d]));S.rev=j.rev;S.loaded=true;
      if($('#status').classList.contains('err'))setStatus('');render();
    }catch(e){if(e?.code===401)return;S.loaded=true;setStatus('Sunucuya ulaşılamıyor; sayfa birkaç saniye içinde yeniden deneyecek.',true);render()}
}
let pollT;
async function startData(){
  await load();
  // Diğer kullanıcıların değişikliklerini 5 sn'de bir kontrol et
  clearInterval(pollT);
  pollT=setInterval(async()=>{if(document.hidden)return;try{const {rev}=await api('GET','/api/rev');if(rev!==S.rev)await load()}catch(e){if(e?.code!==401)setStatus('Sunucuya ulaşılamıyor.',true)}},5000);
}
</script>
